# CMA-MESO 1KM
#   modelvar_ctl cold

_config_version: 3

# Forecast files are produced in forecast-time order as the model integrates.
_arrival_order: sequential

default: NOTFOUND

file_names:
  - modelvar.ctl_{{.Year}}{{.Month}}{{.Day}}{{.Hour}}00000

paths:
  - type: local
    level: runtime
    path: /g2/op_meso/OPER/WORKDIR/cma_meso_1km/cold/{{.Hour}}/fcst/grapes_model/run
