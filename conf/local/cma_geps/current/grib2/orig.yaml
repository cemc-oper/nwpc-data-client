# cma-reps
#   grib2 orig

_config_version: 3

# GRIB2 files are produced by post-processing and do not arrive in forecast-time order.
_arrival_order: unordered

default: NOTFOUND

file_names:
  - gef.gra.{{.Member}}.{{.Year}}{{.Month}}{{.Day}}{{.Hour}}{{.ForecastHour}}.grb2
file_name: Z_NAFP_C_BABJ_{{.Year}}{{.Month}}{{.Day}}{{.Hour}}0000_P_NWPC-GRAPES-GEPS-GLB-{{.ForecastHour}}00-m{{.Member}}.grib2

paths:
  - type: local
    level: archive
    path: /g3/COMMONDATA/OPER/CEMC/GEPS/Prod-grib/{{.Year}}{{.Month}}{{.Day}}{{.Hour}}/grib2

  # datatrans reads secondary storage directly; login nodes fall back to cmafs.
  - type: local
    level: storage
    path: /sstorage/COMMONDATA/OPER/CEMC/GEPS/Prod-grib/{{.Year}}{{.Month}}{{.Day}}{{.Hour}}/grib2.0p25

  # Read the mounted CMADAAS archive directly; keep before cmafs.
  - type: local
    level: archive
    path: '{{.StorageBase}}/DATA/NAFP/NMC/GRAPES-GEPS/{{.Year}}/{{.Year}}{{.Month}}{{.Day}}'

  - type: cmafs
    level: storage
    path: /sstorage/COMMONDATA/OPER/CEMC/GEPS/Prod-grib/{{.Year}}{{.Month}}{{.Day}}{{.Hour}}/grib2.0p25
