# CMA-TYM
#   grib2 orig

_config_version: 3

# GRIB2 files are produced by post-processing and do not arrive in forecast-time order.
_arrival_order: unordered

default: NOTFOUND

file_names:
  - rmf.tcgra.{{.Year}}{{.Month}}{{.Day}}{{.Hour}}{{.ForecastHour}}.grb2
file_name: Z_NAFP_C_BABJ_{{.Year}}{{.Month}}{{.Day}}{{.Hour}}0000_P_NWPC-GRAPES-TYM-ACWP-{{.ForecastHour}}00.grib2

paths:
  - type: local
    level: runtime
    path: /g2/op_post/OPER/WORKDIR/NWP_CMA_TYM_POST_DATA/{{.Year}}{{.Month}}{{.Day}}{{.Hour}}/data/output/grib2_orig

  - type: local
    level: archive
    path: /g3/COMMONDATA/OPER/CEMC/TYM/Prod-grib/{{.Year}}{{.Month}}{{.Day}}{{.Hour}}/ORIG

  # datatrans reads secondary storage directly; login nodes fall back to cmafs.
  - type: local
    level: storage
    path: /sstorage/COMMONDATA/OPER/CEMC/TYM/Prod-grib/{{.Year}}{{.Month}}{{.Day}}{{.Hour}}/ORIG

  # Read the mounted CMADAAS archive directly; keep before cmafs.
  - type: local
    level: archive
    path: '{{.StorageBase}}/DATA/NAFP/NMC/GRAPES-TYM/{{.Year}}/{{.Year}}{{.Month}}{{.Day}}'

  - type: cmafs
    level: storage
    path: /sstorage/COMMONDATA/OPER/CEMC/TYM/Prod-grib/{{.Year}}{{.Month}}{{.Day}}{{.Hour}}/ORIG
