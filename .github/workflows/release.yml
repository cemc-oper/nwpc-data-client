name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GoReleaser needs the full history and tags to build the changelog.
          fetch-depth: 0

      - name: Verify VERSION matches tag
        # The VERSION file declares the next release version; refuse to
        # release if the pushed tag disagrees with it.
        run: |
          vf=$(tr -d '[:space:]' < VERSION)
          if [ "${GITHUB_REF_NAME}" != "v${vf}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION (${vf})"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
