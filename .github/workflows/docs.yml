name: Docs

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'docs/**'
      - 'cmd/**'
      - 'tools/gen-cli-docs/**'
      - 'VERSION'
      - '.github/workflows/docs.yml'
      - '.readthedocs.yaml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'docs/**'
      - 'cmd/**'
      - 'tools/gen-cli-docs/**'
      - 'VERSION'
      - '.github/workflows/docs.yml'
      - '.readthedocs.yaml'

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: docs/requirements.txt

      - name: Install Sphinx dependencies
        # Pin the interpreter: `uv venv` would otherwise pick the newest
        # available Python instead of the one set up above.
        run: |
          uv venv --python 3.14
          uv pip install -r docs/requirements.txt

      # The generated CLI reference pages are committed so that Read the
      # Docs (whose build jobs have no network access) can build the site
      # without Go. Fail if a command definition changed without
      # regenerating them.
      - name: Check CLI reference pages are up to date
        run: |
          go run ./tools/gen-cli-docs ./docs/reference/cli
          git diff --exit-code docs/reference/cli

      - name: Build HTML
        run: .venv/bin/sphinx-build -W --keep-going -b html docs docs/_build/html
