# Read the Docs configuration for nwpc-data-client.
#
# The generated CLI reference pages under docs/reference/cli/ are committed
# to the repository (RTD build jobs have no network access, so `go run`
# cannot be executed there). CI enforces that they are up to date; regenerate
# locally with `make docs-cli` after changing any cobra command definition.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

sphinx:
  configuration: docs/conf.py

# uv is used only as the installer here: the dependencies stay in
# docs/requirements.txt, so there is no lockfile to keep in sync.
# Note: `method: uv` allows a single entry under `python.install`.
python:
  install:
    - method: uv
      command: pip
      requirements: docs/requirements.txt
